{% extends "base.html" %}
{% block title %} — Tài liệu{% endblock %}
{% block content %}
<div class="content-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Tài liệu</h1>
      <p class="page-sub">Quản lý và xử lý tài liệu cho AI tra cứu</p>
    </div>
  </div>

  <!-- Upload area -->
  <div class="upload-zone" id="upload-zone">
    <div class="upload-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div class="upload-text">Kéo thả file vào đây</div>
    <div class="upload-sub">PDF, DOCX, TXT — tối đa 50MB mỗi file</div>
    <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md,.csv" style="display:none">
    <button class="btn-primary" onclick="document.getElementById('file-input').click()">Chọn file</button>
  </div>

  <!-- Upload progress -->
  <div id="upload-progress-list"></div>

  <!-- Document list -->
  <div class="section-title-row">
    <span class="section-title">Tài liệu đã upload</span>
    <span class="doc-count" id="doc-count">0 tài liệu</span>
  </div>
  <div class="doc-list" id="doc-list">
    <div class="empty-state">
      <p>Chưa có tài liệu nào. Hãy upload tài liệu đầu tiên!</p>
    </div>
  </div>
</div>
{% endblock %}
